name: Azure Static Web Apps CI/CD

on:
  # Lets the workflow be started by hand from the Actions tab. Worth having:
  # GitHub's "Re-run jobs" replays the workflow file from the commit that
  # originally ran, so re-running an old failure re-runs the old, broken
  # config — which looks exactly like a fix that did not work.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
    steps:
      # v3 runs on Node 20, which the runners now warn is deprecated.
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # NEXT_PUBLIC_* values are inlined into the bundle at build time, not
          # read at runtime, so they have to exist *here*. Without this the
          # build falls back to the localhost default in src/lib/api.ts and
          # ships a site that calls the developer's own machine.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_PREFIX: ${{ vars.NEXT_PUBLIC_API_PREFIX || '/api/v1' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_SKY_08CEA4100 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          # Empty on purpose. This scaffold shipped with "build", which is the
          # Create React App convention — Next.js never writes a build/
          # directory, so the deploy looked for output that could not exist.
          #
          # It is not "out" either: `output: "export"` is not an option here,
          # because /quote-requests/[id], /teams/[slug] and six other routes
          # take ids that are unknowable at build time and a static export
          # refuses a dynamic segment with no generateStaticParams. Left empty,
          # Static Web Apps builds the Next.js app itself and serves it with
          # hybrid rendering.
          output_location: ""
          # No github_id_token on purpose. When the action is handed an OIDC
          # token it authenticates with that and ignores the deployment token,
          # and this Static Web App has no managed identity or federated
          # credential for the workflow to assume (identity: null on the
          # resource). That path can only fail, and it fails with a message
          # about the api key being invalid — which sends you looking at the
          # one credential that was never used.
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
